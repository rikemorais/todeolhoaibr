[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
todeolho-nucleo = { path = "crates/nucleo" }
todeolho-infraestrutura = { path = "crates/infraestrutura" }
todeolho-fontes = { path = "crates/fontes" }
todeolho-painel = { path = "crates/painel" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
dagron-core = "0.1.1"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
fs4 = "1"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rust-s3 = { version = "0.38", default-features = false, features = ["fail-on-err", "tokio-rustls-tls-ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

# Perfil pensado para compilar em máquinas modestas: ver docs/adr/0007.
[profile.release]
opt-level = "s"
lto = false
codegen-units = 16
debug = false
strip = true
incremental = false
