name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Cache de ~/.cargo e target/ entre runs, para o CI não compilar do zero.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # O ubuntu-latest já traz o toolchain Rust stable (edition 2024 exige
      # >= 1.85). --locked garante que o Cargo.lock está em dia; --workspace
      # roda os testes de todos os crates.
      - run: cargo test --workspace --locked

  # Gate de cobertura: o limite começa na cobertura atual (77,90%) e impede
  # regressões. cargo-llvm-cov publica o resumo por arquivo no log do job.
  cobertura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: rustup component add llvm-tools-preview
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - run: cargo llvm-cov --workspace --locked --fail-under-lines 77.9

  # Formatação e lint: barra PR com código fora do rustfmt ou com qualquer aviso
  # do clippy. `--all-targets` cobre também testes e exemplos.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Cache de ~/.cargo e target/ entre runs, para o CI não compilar do zero.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Gate de documentação: com `#![warn(missing_docs)]` nas bibliotecas, tratar
  # warnings como erro faz o CI falhar quando falta doc em item público ou há
  # link intra-doc quebrado. Mantém a cobertura de docstring sem regredir.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Cache de ~/.cargo e target/ entre runs, para o CI não compilar do zero.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --no-deps --workspace --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
