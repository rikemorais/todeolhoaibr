[package]
name = "todeolho-refino"
description = "Refino: decodifica a camada Raw para as camadas do medalhão (bronze em Parquet)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
todeolho-nucleo.workspace = true

arrow = "59.2.0"
async-trait.workspace = true
chrono.workspace = true
hex.workspace = true
futures.workspace = true
parquet = "59.2.0"
encoding_rs_io = "0.1.7"
serde_json.workspace = true
sha2.workspace = true
tempfile = "3.14.0"
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
csv = "1.4.0"
encoding_rs = "0.8.44"

[dependencies.datafusion]
version = "55.2.0"
default-features = false
features = ["crypto_expressions", "datetime_expressions", "nested_expressions", "parquet", "sql"]

[dev-dependencies]
bytes = "1.12.1"
